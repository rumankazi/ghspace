# Applies pending migrations to the production database.
#
# The `migrations` job in ci.yml does NOT do this, and the distinction has bitten
# us once already. That job migrates a throwaway Postgres service container to
# prove two things about the *code*: that the SQL applies cleanly to a fresh
# database, and that schema.ts has not drifted from the committed migrations. It
# never sees production. Without this workflow, deploying a schema change and
# migrating the database were separate acts with nothing connecting them — merge
# 0004, Vercel ships code that selects a column Postgres does not have, and every
# dashboard render fails with 42703 until someone remembers to run the migration
# by hand.
#
# Scoped to drizzle/** so an ordinary merge does not touch the database at all.
#
# Ordering
# --------
# This does not *order* the migration against the deploy. Vercel builds from the
# same push, and neither waits for the other. In practice this job wins — it is
# checkout plus install plus one ALTER, against a Next.js build — but a race that
# usually goes your way is not a guarantee, so do not rely on it.
#
# What actually makes deploys safe is that a migration should be backward
# compatible with the code already running: add the column in one release, start
# reading it in the next. Then the order genuinely does not matter. 0004 was
# additive on disk but the same release began selecting the column, which is why
# a hand-run migration was the only thing standing between the merge and a broken
# dashboard.
#
# When a migration cannot be split that way, run it first: dispatch this workflow
# against the pull request branch, confirm it is green, then merge.
#
# Required repository secret: DATABASE_URL (already present for sync.yml).
name: migrate

on:
  push:
    branches: [main]
    paths:
      - "packages/core/drizzle/**"
  # Catching up a database that is already behind, and running a migration
  # *before* merging the code that depends on it. See "Ordering" below.
  workflow_dispatch:

concurrency:
  # Two overlapping runs would race on drizzle's migrations table.
  group: ghspace-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - run: bun install --frozen-lockfile

      # migrate.ts reads DATABASE_URL from process.env directly rather than
      # through env(), so this job needs no other secret to start up.
      - name: Apply migrations
        working-directory: packages/core
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # A short-lived job against a managed free tier, which has few
          # connections to spare. Matches sync.yml.
          DATABASE_POOL_MAX: "1"
        run: bun run src/db/migrate.ts
